const MAN=`<h3>目的</h3><p>4つの章（博麗神社〜霧の湖／魔法の森〜紅魔館／白玉楼〜永遠亭／幻想郷の境界）を進み、各章のボス（ルーミア・レミリア・幽々子・八雲紫）を倒すとクリア。クリア後はエンドレスモードに挑戦できる。</p>
<h3>戦闘</h3><p>毎ターン霊力3、手札5枚。カードは霊力を消費して使う。ターンを終えると敵が行動し、敵の頭上に次の行動が表示される。ブロックは毎ターン消える。1ターンに3回攻撃を当てるとカードを1枚引ける（コンボ）。</p>
<h3>カード</h3><p>☆はアンコモン、★はレア。火・氷・毒・星・結界・時の属性があり、組み合わせると反応する。「消滅」は戦闘中1回だけ、「保持」はターン終了後も手札に残る。キャラ専用カードは、そのキャラでしか手に入らない。</p>
<h3>マップ</h3><p>章ごとに枝分かれする地図がある。光っている地点から次の地点を選び、一本道になることもある。戦・強（エリート）・宝・休・店・？がある。？は戦闘・商店・宝箱になることもあり、イベントが続くほど戦闘になりやすい。エリートは強いが武器などの報酬が良く、序盤の階層には出ない。通常戦闘に勝つとHPが少し回復する。</p>
<h3>休憩所</h3><p>HP回復、カードの強化、カードの削除から1つを選ぶ。エンドレスでは回復量が下がる（5〜8章は20%、9章以降は10%）。</p>
<h3>商店とお賽銭</h3><p>お賽銭でカード・武器・展示品を買い、カードを削除できる。物価は章ごとに+10%。削除は回数に応じて高くなる（3章以降は上がり方が増える）。お賽銭は999が上限。</p>
<h3>武器</h3><p>持っている間ずっと効く装備。個数に上限はない。代償つき武器は強力だが、何かを犠牲にする。</p>
<h3>残機と難易度</h3><p>倒れると残機を1つ消費し、HP50%で復活する。難易度はEasy / Normal / Hard / Lunatic / Extra。上げるほど敵が強く、残機が減る。</p>
<h3>演出</h3><p>ダメージ表示の大きさ、敵のやられ演出、属性反応・コンボ・お賽銭獲得のエフェクトと効果音がある。タイトル画面の「演出」ボタンでON/OFFできる。</p>
<h3>図鑑</h3><p>カードは最初から全て見られる（まだ見ていないカードは薄く表示）。武器は手に入れる（または商店で見る）まで効果が伏せられる。記録はこの端末のブラウザに保存される。</p>`;
